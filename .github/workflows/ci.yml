name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # FULL history, not the default fetch-depth: 1. The equivalence tests
      # compare named historical commits (brief 017's table is only as good as
      # the evidence behind it), and in a shallow clone those objects are simply
      # absent - `me.compare()` then sees two empty trees, reports no difference,
      # and NotEquivalent fires with "nothing changed between these commits".
      # Reproduced in python:3.12-slim: full history 749 passed, --depth 1 three
      # failed. The tests are right to fail without history; CI was wrong to
      # withhold it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest

      # The whole suite. 751 tests; 2 skip here because they need the logger's
      # real database, which CI has no copy of - both say so in their skip
      # reason rather than being quietly weakened into passing.
      #
      # It does NOT run on the Windows dev box's default interpreter, where
      # numpy is a MINGW-W64 build on Python 3.14 that takes an access violation
      # on import under pytest. That is one bad install, not a property of the
      # tests: a clean 3.12 venv on the same machine runs all 751. To reproduce
      # this job locally, clone to a temp directory (no .env, as here) and run
      # it from such a venv - the working tree hides these two failures because
      # it has a configured store.
      # Tee the summary into the run page. Log DOWNLOAD needs admin rights, so a
      # failure was readable only by someone with repo admin - the run page is
      # public, and $GITHUB_STEP_SUMMARY renders there for anyone.
      - name: the full suite
        run: |
          set -o pipefail
          python -m pytest -q -rA 2>&1 | tee /tmp/pytest.txt
        shell: bash

      - name: publish the result to the run page
        if: always()
        run: |
          {
            echo '## pytest'
            echo '```'
            tail -60 /tmp/pytest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      # The site vendors this exact file and generates its TypeScript types from
      # it, so a malformed contract breaks the consumer's build, not ours. Fail
      # here instead.
      - name: the contract a consumer would fetch is well formed
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          doc = json.load(open("web/contract/v2/contract.schema.json", encoding="utf-8"))
          Draft202012Validator.check_schema(doc)
          xc = doc["x-contract"]
          missing = [k for k in xc["kinds"].values() if k not in doc["$defs"]]
          assert not missing, f"kinds naming a missing $def: {missing}"
          assert xc["schema_version"] == 2, xc["schema_version"]
          print(f"contract ok: {len(doc['$defs'])} types, {len(xc['kinds'])} kinds")
          PY
